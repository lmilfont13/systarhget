name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      # As funções do servidor rodam em Deno, fora do vitest. Sem isto, a
      # checagem que impede o prompt do Intérprete de divergir entre as duas
      # cópias só rodaria se alguém lembrasse de chamá-la à mão.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Testes das funções (Deno)
        run: deno test --allow-env --allow-net --allow-read --no-check --node-modules-dir=auto supabase/functions/processar-solicitacao/agentes_test.ts

      - name: Build
        run: npm run build
        env:
          # O build não precisa do banco; valores fictícios só evitam o aviso
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
